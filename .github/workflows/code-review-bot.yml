name: Code Review (bazel + clang-tidy)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bazel (manual)
        run: |
          # Try installing Bazel from the official apt repository (preferred)
          sudo apt-get update
          sudo apt-get install -y apt-transport-https curl gnupg || true
          curl -fsSL https://bazel.build/bazel-release.pub.gpg | sudo gpg --dearmor -o /usr/share/keyrings/bazel-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/bazel-archive-keyring.gpg] https://storage.googleapis.com/bazel-apt stable jdk1.8" | sudo tee /etc/apt/sources.list.d/bazel.list
          sudo apt-get update
          sudo apt-get install -y bazel-7.4.1 || sudo apt-get install -y bazel || true
          # Fallback: install bazelisk and symlink to bazel if apt install did not provide bazel
          if ! command -v bazel >/dev/null 2>&1; then
            echo "Installing bazelisk fallback"
            sudo curl -L -o /usr/local/bin/bazelisk https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
            sudo chmod +x /usr/local/bin/bazelisk
            sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel
          fi

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip clang clang-tidy clang-tools

      - name: Install bazel-compilation-database
        run: pip3 install bazel-compilation-database

      - name: Bazel build iceoryx2
        run: bazel build //:iceoryx2

      - name: Generate compile_commands.json
        run: |
          mkdir -p build
          bazel-compilation-database --workspace_path=. --output_file=build/compile_commands.json

      - name: Run code review orchestrator
        run: |
          python3 code-review-bot/src/review_orchestrator.py \
            --repo . \
            --config code-review-bot/review-config.yaml \
            --pr-base "${{ github.event.pull_request.base.ref }}" \
            --pr-head "${{ github.event.pull_request.head.ref }}" \
            --output .review-results/review-results.json \
            --xlsx-output .review-results/review-report.xlsx

      - name: Upload SARIF to GitHub (for code scanning display)
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: .review-results/review-results.sarif

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: code-review-results
          path: .review-results